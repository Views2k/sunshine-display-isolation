name: CI

on:
  push:
    branches: [display-isolation]
  pull_request:
    branches: [display-isolation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify display isolation source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and whitespace
        run: |
          set -euo pipefail
          python3 display-isolation/verify_source.py
          git diff --check 63d35f702ee9e362e43263742981836ec0710384 HEAD -- . ':(exclude)display-isolation/reference.patch'
      - name: Compile and exercise display-selection policy
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -I src display-isolation/test_strict_display_policy.cpp -o "$RUNNER_TEMP/policy-tests"
          "$RUNNER_TEMP/policy-tests"
