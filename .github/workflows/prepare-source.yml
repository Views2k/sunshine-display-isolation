name: Prepare display isolation source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Views2k/sunshine-display-isolation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 display-isolation/prepare_fork.py
